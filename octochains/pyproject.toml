[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octamind"
version = "0.1.0"

description = "A lightweight framework for parallel multi-agent reasoning and collaborative AI systems."

readme = "README.md"

license = { text = "MIT" }

requires-python = ">=3.9"

authors = [
    { name = "Varun", email = "ganisettivarun8@gmail.com" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

keywords = [
    "ai",
    "multi-agent",
    "reasoning",
    "llm",
    "agents",
    "parallel-ai",
    "artificial-intelligence"
]

dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]

openai = [
    "openai>=1.0.0"
]

litellm = [
    "litellm>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/sudhendrasivanadh/.-OctaMind"
Repository = "https://github.com/sudhendrasivanadh/.-OctaMind"
Issues = "https://github.com/sudhendrasivanadh/.-OctaMind/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
octamind = ["*.py"]
